services:
  rest-api-app:
    build:
      context: ./rest-api-app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - default

  graphql-api-app:
    build:
      context: ./graphql-api-app
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - default

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgresdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  hasura:
    image: hasura/graphql-engine:v2.44.1.cli-migrations-v2
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgresdb
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: "admin-secret"
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"your-256-bit-secret-key-very-long-and-very-secure"}'
    networks:
      - default

networks:
  default:
    driver: bridge